const el = id => document.getElementById(id);
function selectedContent() {

function openPreview(path) {

function renderTree() {
  const container = el("tree");
  container.innerHTML = "";
  const activeKeys = steps[stepIndex].activeNodes;
  function walk(nodes, depth) {
    nodes.forEach(node => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tree-item";
      if (node.key && activeKeys.includes(node.key)) btn.classList.add("active");
      if (node.type !== "folder" && node.path === selectedFile) btn.classList.add("selected");
      btn.style.marginLeft = `${depth * 14}px`;
      btn.innerHTML = `<span>${node.type === "folder" ? "📁" : "📄"}</span><span class="tree-label">${node.label}</span>`;
      if (node.type !== "folder" && node.path === selectedFile) {
        const tag = document.createElement("span");
        tag.className = "tag selected";
        tag.textContent = "查看中";
        btn.appendChild(tag);
      } else if (node.key && activeKeys.includes(node.key)) {
        const tag = document.createElement("span");
        tag.className = "tag active";
        tag.textContent = "已加载/生效";
        btn.appendChild(tag);
      }
      if (node.type !== "folder" && node.path) {
        btn.addEventListener("click", () => {
          selectedFile = node.path;
          renderPreview();
          openPreview(node.path);
        });
      } else {
        btn.disabled = true;
        btn.style.cursor = "default";
      }
      container.appendChild(btn);
      if (node.children?.length) walk(node.children, depth + 1);
    });
  }
  walk(tree, 0);

  el("next-btn").disabled = stepIndex === steps.length - 1;

  const loaded = el("loaded-files");

  step.loaded.forEach(item => {

      line.className = "line";
