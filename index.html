<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IM 订单级联选择器</title>
<style>
:root{
  --bg:#f4f6fb;
  --phone:#eef2f8;
  --panel:#ffffff;
  --line:#e4e9f2;
  --text:#111827;
  --muted:#6b7280;
  --brand:#2f5bff;
  --brand-soft:#eef3ff;
  --brand-strong:#2147d8;
  --chip:#f8fafc;
  --shadow:0 22px 50px rgba(41,57,91,.14);
  --radius:24px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"PingFang SC","SF Pro Display","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(47,91,255,.08), transparent 28%),
    linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
  color:var(--text);
}
.page{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(320px, 430px) minmax(320px, 540px);
  gap:36px;
  align-items:center;
  justify-content:center;
  padding:36px 20px;
}
.intro{
  align-self:start;
  padding-top:24px;
}
.eyebrow{
  display:inline-flex;
  padding:8px 12px;
  border:1px solid rgba(47,91,255,.15);
  border-radius:999px;
  background:rgba(255,255,255,.7);
  color:var(--brand-strong);
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
}
h1{
  margin:18px 0 14px;
  font-size:46px;
  line-height:1.08;
  letter-spacing:-.04em;
}
.intro p{
  margin:0 0 20px;
  color:#516074;
  line-height:1.8;
  font-size:15px;
}
.feature-list{
  display:grid;
  gap:10px;
}
.feature{
  background:rgba(255,255,255,.72);
  border:1px solid rgba(228,233,242,.9);
  border-radius:18px;
  padding:14px 16px;
  box-shadow:0 12px 26px rgba(15,23,42,.05);
}
.feature strong{
  display:block;
  margin-bottom:4px;
  font-size:14px;
}
.feature span{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}
.phone-shell{
  justify-self:center;
  width:100%;
  max-width:420px;
  background:#dfe6f1;
  border-radius:40px;
  padding:14px;
  box-shadow:0 35px 80px rgba(27,39,71,.22);
}
.phone{
  position:relative;
  height:820px;
  background:linear-gradient(180deg, #f7f8fc 0%, #eef3f9 100%);
  border-radius:30px;
  overflow:hidden;
}
.statusbar{
  text-align:center;
  padding:12px 16px 6px;
  color:#98a2b3;
  font-size:12px;
  font-weight:600;
}
.chat{
  padding:8px 14px 140px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.msg-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}
.msg-row.self{
  justify-content:flex-end;
}
.avatar{
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#dbe7ff;
  color:#4f6fe8;
  font-size:10px;
  flex:0 0 auto;
}
.bubble{
  max-width:276px;
  padding:12px 14px;
  border-radius:18px;
  font-size:13px;
  line-height:1.55;
  box-shadow:0 8px 20px rgba(15,23,42,.05);
}
.msg-row.self .bubble{
  background:linear-gradient(135deg, #2d58f7, #3f6dff);
  color:#fff;
  border-bottom-right-radius:8px;
}
.msg-row.other .bubble{
  background:#fff;
  color:#334155;
  border:1px solid #edf1f7;
  border-bottom-left-radius:8px;
}
.card-prompt{
  width:100%;
  max-width:286px;
  background:#fff;
  border:1px solid #edf1f7;
  border-radius:18px;
  padding:14px;
  box-shadow:0 10px 24px rgba(15,23,42,.06);
}
.card-prompt h3{
  margin:0;
  font-size:14px;
}
.card-prompt p{
  margin:6px 0 12px;
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}
.entry-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--brand);
  background:var(--brand-soft);
  border:0;
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.composer{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px 14px 16px;
  background:linear-gradient(180deg, rgba(238,243,249,0) 0%, #eef3f9 28%, #eef3f9 100%);
}
.composer-input{
  flex:1;
  height:42px;
  border:1px solid #d8dee8;
  border-radius:999px;
  background:#fff;
  padding:0 16px;
  color:#9aa4b2;
  font-size:12px;
  display:flex;
  align-items:center;
}
.send{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:var(--brand);
  color:#fff;
  font-size:14px;
}
.scrim{
  position:absolute;
  inset:0;
  background:rgba(17,24,39,.34);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
}
.scrim.show{
  opacity:1;
  pointer-events:auto;
}
.sheet{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  transform:translateY(calc(100% + 20px));
  transition:transform .24s ease;
  overflow:hidden;
}
.sheet.show{
  transform:translateY(0);
}
.sheet-header{
  position:relative;
  padding:14px 18px 12px;
  text-align:center;
  border-bottom:1px solid #eef2f7;
}
.sheet-header::before{
  content:"";
  display:block;
  width:42px;
  height:4px;
  border-radius:999px;
  background:#d6dce8;
  margin:0 auto 10px;
}
.sheet-header h2{
  margin:0;
  font-size:15px;
}
.sheet-subtitle{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
}
.sheet-body{
  max-height:470px;
  overflow:auto;
  padding:12px 14px 14px;
}
.section{
  display:grid;
  gap:10px;
}
.label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#475569;
  font-size:12px;
  font-weight:700;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#64748b;
  font-weight:600;
}
.order-card,.selected-card,.add-card{
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
}
.order-head{
  display:flex;
  gap:10px;
  padding:12px;
  border-bottom:1px solid #f0f3f8;
}
.thumb{
  width:44px;
  height:44px;
  border-radius:12px;
  background:linear-gradient(135deg, #f2f5fb, #dfe8f8);
  display:grid;
  place-items:center;
  color:#94a3b8;
  font-size:11px;
  font-weight:700;
  flex:0 0 auto;
}
.order-meta h4,.selected-main h4,.add-card h4{
  margin:0;
  font-size:13px;
  line-height:1.45;
}
.meta-line{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
}
.sku-list{
  display:grid;
  gap:8px;
  padding:12px;
}
.sku{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  border:1px solid #e8edf6;
  border-radius:14px;
  padding:11px 12px;
}
.sku.active{
  border-color:#8db0ff;
  background:#f6f9ff;
  box-shadow:inset 0 0 0 1px rgba(47,91,255,.12);
}
.sku-title{
  font-size:13px;
  font-weight:700;
}
.sku-desc{
  margin-top:4px;
  font-size:11px;
  color:var(--muted);
}
.qty{
  display:inline-flex;
  align-items:center;
  border:1px solid #d9e2f2;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}
.qty button{
  width:28px;
  height:28px;
  border:0;
  background:#fff;
  color:#4b5563;
  font-size:15px;
  cursor:pointer;
}
.qty span{
  width:28px;
  text-align:center;
  font-size:12px;
  font-weight:700;
}
.sheet-footer{
  display:flex;
  gap:10px;
  padding:12px 14px 16px;
  border-top:1px solid #eef2f7;
  background:#fff;
}
.btn{
  height:40px;
  border-radius:12px;
  border:1px solid #d7dfec;
  background:#fff;
  color:#475569;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.btn.subtle{
  flex:1;
}
.btn.primary{
  flex:1.3;
  border-color:var(--brand);
  background:var(--brand);
  color:#fff;
}
.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.selected-card{
  padding:12px;
  display:grid;
  gap:10px;
}
.selected-row{
  display:flex;
  gap:10px;
}
.selected-main{
  flex:1;
}
.selected-line{
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
.add-list{
  display:grid;
  gap:10px;
}
.add-card{
  padding:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}
.add-card button{
  border:0;
  background:var(--brand-soft);
  color:var(--brand);
  border-radius:999px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.toolbar{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}
.toolbar button{
  padding:11px 15px;
  border-radius:14px;
  border:1px solid #d8e0ec;
  background:#fff;
  color:#324155;
  font-weight:700;
  cursor:pointer;
}
@media (max-width:980px){
  .page{grid-template-columns:1fr;gap:20px;padding:20px}
  .intro{padding-top:0}
  h1{font-size:34px}
  .phone{height:780px}
}
</style>
</head>
<body>
<div class="page">
  <section class="intro">
    <div class="eyebrow">IM Window Selector</div>
    <h1>级联选订单的 IM 侧滑选择器</h1>
    <p>这个原型复现了你图里的核心链路：在 IM 会话中触发退款项选择器，先选同一订单下的商品与数量，再汇总成已选状态，并支持继续添加其他订单。</p>
    <div class="feature-list">
      <div class="feature"><strong>弹出式工具</strong><span>以聊天窗口底部浮层方式出现，不打断当前会话上下文。</span></div>
      <div class="feature"><strong>订单级联</strong><span>先选择订单，再选择 SKU 和数量；跨订单时进入“添加更多订单”流程。</span></div>
      <div class="feature"><strong>结果回填</strong><span>确认后把已选内容回写到聊天区，方便继续走退款申请或客服处理。</span></div>
    </div>
    <div class="toolbar">
      <button id="open-entry">打开选择器</button>
      <button id="open-summary">查看已选状态</button>
      <button id="reset-demo">重置演示</button>
    </div>
  </section>

  <section class="phone-shell">
    <div class="phone">
      <div class="statusbar">9:41</div>
      <div class="chat" id="chat-list"></div>
      <div class="composer">
        <div class="composer-input">请输入想咨询的问题…</div>
        <button class="send">➤</button>
      </div>

      <div class="scrim" id="scrim"></div>

      <div class="sheet" id="sheet">
        <div class="sheet-header">
          <h2 id="sheet-title">选择退款项目</h2>
          <p class="sheet-subtitle" id="sheet-subtitle"></p>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
        <div class="sheet-footer" id="sheet-footer"></div>
      </div>
    </div>
  </section>
</div>

<script>
const orders = [
  {
    id: "A1001",
    shop: "希尔顿酒店（三亚湾美高梅）",
    time: "2025-10-12 13:00",
    summary: "酒店预订",
    items: [
      { id: "A1001-1", title: "10月12日（周六）", desc: "豪华大床房 | 含早 | 2间 1晚", price: 1200, max: 2 },
      { id: "A1001-2", title: "10月13日（周日）", desc: "豪华大床房 | 含早 | 2间 1晚", price: 1200, max: 1 }
    ]
  },
  {
    id: "B2048",
    shop: "上海迪士尼乐园",
    time: "2025-10-05 09:00",
    summary: "乐园门票",
    items: [
      { id: "B2048-1", title: "成人票", desc: "单日票 | 2张", price: 499, max: 2 }
    ]
  },
  {
    id: "C3302",
    shop: "奔跑松水镇（100元代金券）",
    time: "2025-10-08 18:00",
    summary: "餐饮代金券",
    items: [
      { id: "C3302-1", title: "代金券", desc: "面额100元 | 1张", price: 100, max: 1 }
    ]
  }
];

const baseMessages = [
  { role: "self", text: "你好，我想退一单，看看存不存在问题？" },
  { role: "other", text: "好的，您想退哪一笔？请点击卡片选择您想要申请退款的订单。", card: true }
];

const state = {
  view: "closed",
  activeOrderId: orders[0].id,
  selections: {}
};

const chatList = document.getElementById("chat-list");
const sheet = document.getElementById("sheet");
const scrim = document.getElementById("scrim");
const sheetTitle = document.getElementById("sheet-title");
const sheetSubtitle = document.getElementById("sheet-subtitle");
const sheetBody = document.getElementById("sheet-body");
const sheetFooter = document.getElementById("sheet-footer");

function formatPrice(value) {
  return "¥" + value.toLocaleString("zh-CN");
}

function getOrder(orderId) {
  return orders.find(order => order.id === orderId);
}

function selectedEntries() {
  const result = [];
  Object.entries(state.selections).forEach(([orderId, map]) => {
    const order = getOrder(orderId);
    if (!order) return;
    order.items.forEach(item => {
      const qty = map[item.id] || 0;
      if (qty > 0) result.push({ order, item, qty });
    });
  });
  return result;
}

function selectedCount() {
  return selectedEntries().reduce((sum, entry) => sum + entry.qty, 0);
}

function selectedOrderIds() {
  return [...new Set(selectedEntries().map(entry => entry.order.id))];
}

function renderChat() {
  chatList.innerHTML = "";
  const selected = selectedEntries();
  const messages = [...baseMessages];
  if (selected.length) {
    const orderCount = selectedOrderIds().length;
    messages.push({
      role: "other",
      selectedCard: true,
      title: "已选退款项目",
      subtitle: orderCount + " 笔订单"
    });
    messages.push({
      role: "self",
      text: `我选好了，${selectedCount()} 件，已提交申请。`
    });
    messages.push({
      role: "other",
      text: "收到，正在为您处理退款申请。"
    });
  }

  messages.forEach(message => {
    const row = document.createElement("div");
    row.className = "msg-row " + message.role;

    if (message.role === "other") {
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";
      row.appendChild(avatar);
    }

    if (message.card) {
      const card = document.createElement("div");
      card.className = "card-prompt";
      card.innerHTML = '<h3>退款申请</h3><p>可对订单里的商品或房晚进行选择，支持后续继续添加其他订单。</p>';
      const btn = document.createElement("button");
      btn.className = "entry-link";
      btn.textContent = "去选择退款项目";
      btn.addEventListener("click", () => openSelector("items", orders[0].id));
      card.appendChild(btn);
      row.appendChild(card);
    } else if (message.selectedCard) {
      const card = document.createElement("div");
      card.className = "card-prompt";
      card.innerHTML = `<h3>${message.title}</h3><p>${message.subtitle}</p>`;
      selected.forEach(entry => {
        const line = document.createElement("div");
        line.style.fontSize = "12px";
        line.style.color = "#475569";
        line.style.marginTop = "8px";
        line.textContent = `${entry.order.shop} / ${entry.item.title} × ${entry.qty}`;
        card.appendChild(line);
      });
      row.appendChild(card);
    } else {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.text;
      row.appendChild(bubble);
    }

    chatList.appendChild(row);
  });
}

function ensureOrderSelection(orderId) {
  if (!state.selections[orderId]) state.selections[orderId] = {};
}

function updateQty(orderId, itemId, diff) {
  const order = getOrder(orderId);
  if (!order) return;
  const item = order.items.find(entry => entry.id === itemId);
  ensureOrderSelection(orderId);
  const current = state.selections[orderId][itemId] || 0;
  const next = Math.max(0, Math.min(item.max, current + diff));
  state.selections[orderId][itemId] = next;
  if (!Object.values(state.selections[orderId]).some(Boolean)) delete state.selections[orderId];
  renderSheet();
}

function clearCurrentOrder() {
  delete state.selections[state.activeOrderId];
  renderSheet();
}

function openSelector(view, orderId) {
  state.view = view;
  state.activeOrderId = orderId || state.activeOrderId;
  sheet.classList.add("show");
  scrim.classList.add("show");
  renderSheet();
}

function closeSelector() {
  state.view = "closed";
  sheet.classList.remove("show");
  scrim.classList.remove("show");
}

function renderItemsView() {
  const order = getOrder(state.activeOrderId);
  const picked = state.selections[order.id] || {};
  const count = Object.values(picked).reduce((sum, qty) => sum + qty, 0);
  sheetTitle.textContent = "选择退款项目";
  sheetSubtitle.textContent = "选择当前订单中的商品或房晚";
  sheetBody.innerHTML = `
    <div class="section">
      <div class="label"><span>请选择您要退款的订单</span><span class="badge">${order.id}</span></div>
      <div class="order-card">
        <div class="order-head">
          <div class="thumb">图片</div>
          <div class="order-meta">
            <h4>${order.shop}</h4>
            <div class="meta-line">${order.time}</div>
            <div class="meta-line">${order.summary}</div>
          </div>
        </div>
        <div class="sku-list" id="sku-list"></div>
      </div>
    </div>
  `;

  const skuList = document.getElementById("sku-list");
  order.items.forEach(item => {
    const qty = picked[item.id] || 0;
    const row = document.createElement("div");
    row.className = "sku" + (qty > 0 ? " active" : "");
    row.innerHTML = `
      <div>
        <div class="sku-title">${item.title}</div>
        <div class="sku-desc">${item.desc}</div>
        <div class="sku-desc">${formatPrice(item.price)}</div>
      </div>
      <div class="qty">
        <button type="button" data-op="-">-</button>
        <span>${qty}</span>
        <button type="button" data-op="+">+</button>
      </div>
    `;
    row.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => updateQty(order.id, item.id, button.dataset.op === "+" ? 1 : -1));
    });
    skuList.appendChild(row);
  });

  sheetFooter.innerHTML = "";
  const resetBtn = document.createElement("button");
  resetBtn.className = "btn subtle";
  resetBtn.textContent = "清空重选";
  resetBtn.addEventListener("click", clearCurrentOrder);

  const confirmBtn = document.createElement("button");
  confirmBtn.className = "btn primary";
  confirmBtn.textContent = "确认选择";
  confirmBtn.disabled = count === 0;
  confirmBtn.addEventListener("click", () => openSelector("summary", state.activeOrderId));

  sheetFooter.append(resetBtn, confirmBtn);
}

function renderSummaryView() {
  const entries = selectedEntries();
  sheetTitle.textContent = "选择退款项目";
  sheetSubtitle.textContent = "已选退款内容";
  sheetBody.innerHTML = `
    <div class="section">
      <div class="label"><span>已选退款内容</span><span class="badge">${selectedOrderIds().length} 笔订单</span></div>
      <div class="selected-card" id="selected-list"></div>
      <button class="btn subtle" id="more-order-btn" style="width:100%">+ 新增退款订单</button>
    </div>
  `;

  const list = document.getElementById("selected-list");
  entries.forEach(entry => {
    const card = document.createElement("div");
    card.className = "selected-row";
    card.innerHTML = `
      <div class="thumb">订单</div>
      <div class="selected-main">
        <h4>${entry.order.shop}</h4>
        <div class="selected-line">${entry.item.title} / ${entry.item.desc}</div>
        <div class="selected-line">${entry.order.time}　× ${entry.qty}</div>
      </div>
    `;
    list.appendChild(card);
  });

  document.getElementById("more-order-btn").addEventListener("click", () => openSelector("add", state.activeOrderId));

  sheetFooter.innerHTML = "";
  const backBtn = document.createElement("button");
  backBtn.className = "btn subtle";
  backBtn.textContent = "返回修改";
  backBtn.addEventListener("click", () => openSelector("items", state.activeOrderId));

  const submitBtn = document.createElement("button");
  submitBtn.className = "btn primary";
  submitBtn.textContent = "确认选择";
  submitBtn.addEventListener("click", () => {
    closeSelector();
    renderChat();
  });

  sheetFooter.append(backBtn, submitBtn);
}

function renderAddView() {
  const pickedOrderIds = new Set(selectedOrderIds());
  const candidates = orders.filter(order => !pickedOrderIds.has(order.id));
  sheetTitle.textContent = "添加更多订单";
  sheetSubtitle.textContent = "继续选择其他可退款订单";
  sheetBody.innerHTML = `
    <div class="section">
      <div class="add-list" id="add-list"></div>
    </div>
  `;

  const list = document.getElementById("add-list");
  candidates.forEach(order => {
    const card = document.createElement("div");
    card.className = "add-card";
    card.innerHTML = `
      <div>
        <h4>${order.shop}</h4>
        <div class="meta-line">${order.time}</div>
        <div class="meta-line">${order.summary}</div>
      </div>
      <button type="button">添加</button>
    `;
    card.querySelector("button").addEventListener("click", () => openSelector("items", order.id));
    list.appendChild(card);
  });

  if (!candidates.length) {
    list.innerHTML = '<div class="selected-card"><div class="meta-line">没有更多可添加的订单了。</div></div>';
  }

  sheetFooter.innerHTML = "";
  const backBtn = document.createElement("button");
  backBtn.className = "btn subtle";
  backBtn.textContent = "返回";
  backBtn.addEventListener("click", () => openSelector("summary", state.activeOrderId));

  const doneBtn = document.createElement("button");
  doneBtn.className = "btn primary";
  doneBtn.textContent = "完成";
  doneBtn.addEventListener("click", () => openSelector("summary", state.activeOrderId));

  sheetFooter.append(backBtn, doneBtn);
}

function renderSheet() {
  if (state.view === "items") renderItemsView();
  if (state.view === "summary") renderSummaryView();
  if (state.view === "add") renderAddView();
}

document.getElementById("open-entry").addEventListener("click", () => openSelector("items", orders[0].id));
document.getElementById("open-summary").addEventListener("click", () => {
  if (!selectedEntries().length) {
    state.selections = { [orders[0].id]: { [orders[0].items[0].id]: 1 } };
    renderChat();
  }
  openSelector("summary", selectedOrderIds()[0] || orders[0].id);
});
document.getElementById("reset-demo").addEventListener("click", () => {
  state.selections = {};
  closeSelector();
  renderChat();
});
scrim.addEventListener("click", closeSelector);

renderChat();
</script>
</body>
</html>
